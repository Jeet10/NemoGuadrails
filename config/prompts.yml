# Prompt definitions for tasks not covered by defaults or where you want explicit control.

# Fact-checking prompt (Task.SELF_CHECK_FACTS).
# You can omit the 'models' list to apply universally; keeping it explicit here to match the model in the error.
prompts:
  - task: self_check_facts
    content: |-
      You are given evidence passages and a candidate answer (hypothesis).
      Determine if the answer is fully grounded in, and entailed by, ONLY the evidence.
      Answer strictly with "yes" or "no".
      evidence: {{ evidence }}
      hypothesis: {{ response }}
      entails:

# (Optional) If you later run into similar errors for other tasks (e.g., self_check_output),
# define them similarly here.